steps:
  # Debug Information
  - script: |
      echo "============ Debug Information ============"
      echo "Current branch: $(BRANCH_NAME)"
      echo "Environment: $(ENVIRONMENT)"
      echo "AWS Service Connect: $(AWS_SERVICE_CONNECTION)"
      echo "AWS Region: $(AWS_REGION)"
      echo "AWS Deploy Role: $(AWS_DEPLOY_ROLE)"
      echo "Project Client: $(CLIENT)"
      echo "Project Project: $(PROJECT)"
      echo "Project Environment: $(ENVIRONMENT)"
      echo "Project Infrastructure: $(INFRASTRUCTURE)"
      echo "Project Code App: $(CODE_APP)"
      echo "=========================================="
    displayName: 'Debug variables de entorno'

  # Install AWS CLI
  - script: |
      set -ex
      sudo apt-get update
      sudo apt-get install -y curl unzip jq
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      sudo ./aws/install --update
      aws --version
    displayName: 'Install AWS CLI'

  # Verificar y crear el bucket de S3 si no existe - Usando el rol de despliegue
  - task: AWSShellScript@1
    displayName: "Verificar y Crear Bucket S3 para Terraform en Cuenta Destino"
    inputs:
      awsCredentials: "$(AWS_SERVICE_CONNECTION)"
      regionName: "$(AWS_REGION)"
      scriptType: "inline"
      inlineScript: |
        set -ex
        echo "Verificando si el bucket S3 para el estado de Terraform existe..."

        BUCKET_NAME="$(CLIENT)-$(PROJECT)-$(ENVIRONMENT)-$(INFRASTRUCTURE)-$(CODE_APP)-terraform-state"
        AWS_REGION="$(AWS_REGION)"
        AWS_DEPLOY_ROLE="$(AWS_DEPLOY_ROLE)"
        
        echo "Bucket name: $BUCKET_NAME"
        echo "AWS Region: $AWS_REGION"
        echo "Deploy Role: $AWS_DEPLOY_ROLE"
        
        echo "Asumiendo rol de despliegue: $AWS_DEPLOY_ROLE"
        TEMP_CREDS=$(aws sts assume-role --role-arn "$AWS_DEPLOY_ROLE" --role-session-name "TerraformStateSetup" --output json)
        
        if [ $? -ne 0 ]; then
          echo "Error al asumir el rol $AWS_DEPLOY_ROLE"
          exit 1
        fi
        
        export AWS_ACCESS_KEY_ID=$(echo $TEMP_CREDS | jq -r '.Credentials.AccessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo $TEMP_CREDS | jq -r '.Credentials.SecretAccessKey')
        export AWS_SESSION_TOKEN=$(echo $TEMP_CREDS | jq -r '.Credentials.SessionToken')
        
        echo "Credenciales temporales configuradas correctamente"
        
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "El bucket $BUCKET_NAME ya existe en la cuenta destino."
        else
          echo "El bucket $BUCKET_NAME no existe en la cuenta destino. Creándolo..."
  
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$BUCKET_NAME"
          else
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
  
          echo "Habilitando versionado en el bucket $BUCKET_NAME..."
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
          
          echo "Configurando cifrado por defecto para el bucket..."
          aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{
            "Rules": [
              {
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }
            ]
          }'
          
          echo "Configurando bloqueo de acceso público para el bucket..."
          aws s3api put-public-access-block --bucket "$BUCKET_NAME" --public-access-block-configuration '{
            "BlockPublicAcls": true,
            "IgnorePublicAcls": true,
            "BlockPublicPolicy": true,
            "RestrictPublicBuckets": true
          }'
        fi
        
        unset AWS_ACCESS_KEY_ID
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN
        
        echo "Proceso de verificación/creación del bucket S3 completado exitosamente"
