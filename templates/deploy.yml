steps:
  - bash: |
      echo "============ Debug Information ============"
      echo "Branch: $(BRANCH_NAME)"
      echo "Environment: $(ENVIRONMENT)"
      echo "Infrastructure Type: $(INFRASTRUCTURE)"
      echo "Working Directory: $(pwd)"
      echo "==========================================="
    displayName: 'Show Debug Information'

  - download: current
    artifact: TerraformPlan
    displayName: 'Download Terraform Plan'

  - download: current
    artifact: BuildArtifacts
    displayName: 'Download Build Artifacts'

  - bash: |
      set -ex
      echo "Preparing workspace..."
      unzip -o $(Pipeline.Workspace)/BuildArtifacts/terraform_artifact.zip
      cp $(Pipeline.Workspace)/TerraformPlan/tfplan tfplan
      ls -la
    displayName: 'Prepare Workspace'

  - script: |
      set -ex
      wget https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
      unzip -o terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
      sudo mv -f terraform /usr/local/bin/
      rm terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
      terraform version
    displayName: 'Install Terraform'

  - task: AWSShellScript@1
    displayName: "Terraform Init"
    inputs:
      awsCredentials: "$(AWS_SERVICE_CONNECTION)"
      regionName: "$(AWS_REGION)"
      scriptType: "inline"
      inlineScript: |
        set -ex
        terraform init \
          -backend=true \
          -reconfigure \
          -backend-config="bucket=$(CLIENT)-$(PROJECT)-$(ENVIRONMENT)-$(INFRASTRUCTURE)-$(CODE_APP)-terraform-state" \
          -backend-config="key=$(CLIENT)-$(PROJECT)-$(ENVIRONMENT)-$(INFRASTRUCTURE)/terraform.tfstate" \
          -backend-config="region=$(AWS_REGION)"

  - task: AWSShellScript@1
    displayName: "Terraform Apply"
    inputs:
      awsCredentials: "$(AWS_SERVICE_CONNECTION)"
      regionName: "$(AWS_REGION)"
      scriptType: "inline"
      inlineScript: |
        set -ex
        terraform apply \
          -auto-approve \
          tfplan
